<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>horari</title>
        <meta name="description" content="daniel">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="/plantilla/css/style.css">
        <link rel="stylesheet" href="/plantilla/css/colors.css">
    </head>

    <body>
        <header>
            <h1>Horari</h1>
        </header>
        <main>
            <table border="1">
                <thead rowspan="2">
                    <th>Hora</th>
                    <th>Dilluns</th>
                    <th>Dimarts</th>
                    <th>Dimecres</th>
                    <th>Dijous</th>
                    <th>Divendres</th>
                </thead>
                <tr>
                    <td>8:00-9:00</td>
                    <td rowspan="2" class="table-text-color, bg-crimson">ASO</td>
                    <td rowspan="3" class="table-text-color, bg-green">BD</td>
                    <td rowspan="2" class="table-text-color, bg-blue">HLLD</td>
                    <td rowspan="2" class="table-text-color, bg-brown">IPO1</td>
                    <td rowspan="2" class="table-text-color, bg-crimson">ASO</td>
                </tr>
                <tr>
                    <td>9:00-10:00</td>
                </tr>
                <tr>
                    <td>10:00-11:00</td>
                    <td class="table-text-color, bg-yellow">Marques</td>
                    <td class="table-text-color, bg-orange">Tutoria</td>
                    <td class="table-text-color, bg-green">BD</td>
                    <td class="table-text-color, bg-orange">SX</td>
                </tr>
                <tr>
                    <td>11:00-11:30</td>
                    <td colspan="5">Pati</td>
                </tr>
                <tr>
                    <td>11:30-12:30</td>
                    <td class="table-text-color, bg-yellow">Marques</td>
                    <td rowspan="3" class="table-text-color, bg-purple">ISO</td>
                    <td class="table-text-color, bg-black">FM</td>
                    <td class="table-text-color, bg-green">BD</td>
                    <td class="table-text-color, bg-orange">SX</td>
                </tr>
                <tr>
                    <td>12:30-13:30</td>
                    <td class="table-text-color, bg-blue">HLLD</td>
                    <td class="table-text-color, bg-cyan">IPO2</td>
                    <td rowspan="2" class="table-text-color, bg-brown">IPO1</td>
                    <td class="table-text-color, bg-black">FM</td>
                </tr>
                <tr>
                    <td>13:30-14:30</td>
                    <td></td>
                    <td></td>
                    <td class="table-text-color, bg-cyan">IPO2</td>
                </tr>
            </table>
        </main>
    </body>
</html>
